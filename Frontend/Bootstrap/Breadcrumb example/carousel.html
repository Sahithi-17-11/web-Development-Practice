<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Bootstrap Carousel</title>
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Bootstrap Carousel Example</h2>

    <!-- Carousel Starts -->
    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">

        <!-- Indicators -->
        <div class="carousel-indicators">
            <button type="button"
                    data-bs-target="#travelCarousel"
                    data-bs-slide-to="0"
                    class="active"></button>

            <button type="button"
                    data-bs-target="#travelCarousel"
                    data-bs-slide-to="1"></button>

            <button type="button"
                    data-bs-target="#travelCarousel"
                    data-bs-slide-to="2"></button>
        </div>

        <!-- Slides -->
        <div class="carousel-inner">

            <!-- Slide 1 -->
            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=1200"
                     class="d-block w-100"
                     alt="Paris">

                <div class="carousel-caption">
                    <h3>Paris</h3>
                    <p>Explore the City of Lights.</p>
                    <button class="btn btn-primary">Book Now</button>
                </div>
            </div>

            <!-- Slide 2 -->
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=1200"
                     class="d-block w-100"
                     alt="London">

                <div class="carousel-caption">
                    <h3>London</h3>
                    <p>Visit the beautiful capital of England.</p>
                    <button class="btn btn-success">Explore</button>
                </div>
            </div>

            <!-- Slide 3 -->
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200"
                     class="d-block w-100"
                     alt="Beach">

                <div class="carousel-caption">
                    <h3>Beach Holiday</h3>
                    <p>Enjoy your summer vacation.</p>
                    <button class="btn btn-warning">View Packages</button>
                </div>
            </div>

        </div>

        <!-- Previous Button -->
        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#travelCarousel"
                data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

        </button>

        <!-- Next Button -->
        <button class="carousel-control-next"
                type="button"
                data-bs-target="#travelCarousel"
                data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

        </button>

    </div>

</div>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
